{% extends "base.html" %}
{% block icerik %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="bi bi-people me-2 text-primary"></i>Öğrenciler</h2>
  <a href="/ogrenciler/ekle" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Yeni Öğrenci</a>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-primary">
        <tr>
          <th>#</th>
          <th>Ad Soyad</th>
          <th>E-posta</th>
          <th>Telefon</th>
          <th class="text-end">İşlemler</th>
        </tr>
      </thead>
      <tbody>
        {% for o in ogrenciler %}
        <tr>
          <td>{{ o.ogrenci_id }}</td>
          <td>{{ o.ad }} {{ o.soyad }}</td>
          <td>{{ o.email }}</td>
          <td>{{ o.telefon }}</td>
          <td class="text-end">
            <a href="/ogrenciler/guncelle/{{ o.ogrenci_id }}" class="btn btn-sm btn-outline-primary me-1">
              <i class="bi bi-pencil"></i>
            </a>
            <form action="/ogrenciler/sil/{{ o.ogrenci_id }}" method="POST" class="d-inline"
                  onsubmit="return confirm('Bu öğrenciyi silmek istediğinize emin misiniz?')">
              <button type="submit" class="btn btn-sm btn-outline-danger">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="text-center text-muted py-4">Henüz öğrenci eklenmedi.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

{% endblock %}
