{% extends "base.html" %}
{% block icerik %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0"><i class="bi bi-book-fill me-2"></i>{{ baslik }}</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Kurs Adı</label>
            <input type="text" name="kurs_adi" class="form-control"
                   value="{{ kurs.kurs_adi if kurs else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Dil</label>
            <input type="text" name="dil" class="form-control"
                   value="{{ kurs.dil if kurs else '' }}"
                   placeholder="İngilizce, Almanca, Fransızca..." required>
          </div>
          <div class="mb-3">
            <label class="form-label">Seviye</label>
            <select name="seviye" class="form-select" required>
              {% set seviyeler = ["A1", "A2", "B1", "B2", "C1", "C2"] %}
              {% for s in seviyeler %}
                <option value="{{ s }}" {% if kurs and kurs.seviye == s %}selected{% endif %}>{{ s }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Saatlik Ücret (₺)</label>
              <input type="number" name="saatlik_ucret" class="form-control" step="0.01" min="0"
                     value="{{ kurs.saatlik_ucret if kurs else '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Haftalık Ders Saati</label>
              <input type="number" name="haftalik_saat" class="form-control" min="1" max="20"
                     value="{{ kurs.haftalik_saat if kurs else '2' }}" required>
            </div>
          </div>
          <div class="alert alert-info py-2 small">
            <i class="bi bi-info-circle me-1"></i>
            Aylık ücret = Saatlik ücret × Haftalık saat × 4 hafta
          </div>
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check2 me-1"></i>Kaydet
            </button>
            <a href="/kurslar" class="btn btn-secondary">
              <i class="bi bi-x me-1"></i>İptal
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
