{% extends "base.html" %}
{% block icerik %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-person-fill me-2"></i>{{ baslik }}</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Ad</label>
            <input type="text" name="ad" class="form-control"
                   value="{{ ogrenci.ad if ogrenci else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Soyad</label>
            <input type="text" name="soyad" class="form-control"
                   value="{{ ogrenci.soyad if ogrenci else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">E-posta</label>
            <input type="email" name="email" class="form-control"
                   value="{{ ogrenci.email if ogrenci else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Telefon</label>
            <input type="text" name="telefon" class="form-control"
                   value="{{ ogrenci.telefon if ogrenci else '' }}">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check2 me-1"></i>Kaydet
            </button>
            <a href="/ogrenciler" class="btn btn-secondary">
              <i class="bi bi-x me-1"></i>İptal
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
